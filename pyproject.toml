[project]
name = "ohgi-review-server"
version = "1.0.0"
description = "오지 레스토랑 리뷰와 사장님 답글 API (FastAPI 미니 프로젝트)"
requires-python = ">=3.14"
dependencies = [
    # FastAPI와 서버 실행에 필요한 부가 기능(uvicorn, fastapi 명령 등)
    "fastapi[standard]",
    # .env와 환경 변수에서 설정값을 읽는다 (app/core/config.py)
    "pydantic-settings",
    # OpenAI 공식 라이브러리 (app/clients/llm_client.py)
    "openai",
]

# uv run fastapi dev 명령이 실행할 앱의 위치. "app/main.py 파일의 app 객체"라는 뜻이다.
[tool.fastapi]
entrypoint = "app.main:app"

# 개발할 때만 쓰는 도구 (uv add --dev pytest pytest-cov)
[dependency-groups]
dev = [
    "pytest",
    "pytest-cov",
]

[tool.pytest.ini_options]
# uv run pytest가 테스트를 찾을 폴더
testpaths = ["tests"]
# 테스트 파일에서 from app... 으로 import 할 수 있게 프로젝트 폴더를 모듈 검색 경로에 넣는다
pythonpath = ["."]
